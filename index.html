<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name — Writing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffe6ef;
    --card: rgba(255, 255, 255, 0.62);
    --ink: #3a0f2b;
    --ink-soft: #7a4766;
    --rule: rgba(58, 15, 43, 0.16);
    --pink: #d61f69;
    --hot: #ff4d94;
    --glow-1: #ff9ec4;
    --glow-2: #d9b8ff;
    --glow-3: #ffcfae;
    --display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1d0a19; --card: rgba(255, 255, 255, 0.06); --ink: #ffe3ee; --ink-soft: #d9a4bf;
      --rule: rgba(255, 227, 238, 0.18); --pink: #ff7bb0; --hot: #ff4d94;
      --glow-1: #7a1b4c; --glow-2: #3d1f6b; --glow-3: #6b2a2f;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1d0a19; --card: rgba(255, 255, 255, 0.06); --ink: #ffe3ee; --ink-soft: #d9a4bf;
    --rule: rgba(255, 227, 238, 0.18); --pink: #ff7bb0; --hot: #ff4d94;
    --glow-1: #7a1b4c; --glow-2: #3d1f6b; --glow-3: #6b2a2f;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--paper); scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; color: var(--ink); font-family: var(--display); font-size: 1.15rem; line-height: 1.7;
    -webkit-font-smoothing: antialiased; min-height: 100vh; position: relative; isolation: isolate;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(48rem 34rem at 88% 4%, var(--glow-2), transparent 62%),
      radial-gradient(42rem 32rem at 4% 14%, var(--glow-1), transparent 60%),
      radial-gradient(40rem 30rem at 70% 96%, var(--glow-3), transparent 64%);
    opacity: 0.85;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; border-radius: 4px; }

  .wrap { max-width: 62rem; margin: 0 auto; padding: 0 1.5rem; }

  header.site { padding: 1.5rem 0 0.5rem; }
  header.site .wrap { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .brand { font-style: italic; font-weight: 600; font-size: 1.35rem; text-decoration: none; }
  nav { display: flex; gap: 0.4rem; font-family: var(--ui); font-weight: 500; font-size: 0.98rem; }
  nav a { text-decoration: none; padding: 0.3rem 0.95rem; border-radius: 999px; }
  nav a:hover { background: var(--card); }
  nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }

  /* Hero: the one loud thing */
  .hero { position: relative; padding: 3.5rem 0 2.5rem; }
  .hero h1 {
    font-weight: 800; font-style: italic;
    font-size: clamp(3.4rem, 14.5vw, 10rem);
    line-height: 0.92; letter-spacing: -0.035em; margin: 0; max-width: 11ch;
    color: var(--ink);
    text-wrap: balance;
  }
  .hero .sub { font-family: var(--ui); max-width: 26rem; margin: 1.75rem 0 0; color: var(--ink-soft); font-size: 1.05rem; line-height: 1.55; }
  .sticker {
    position: absolute; right: 0; top: 2.5rem; width: clamp(7.5rem, 20vw, 10.5rem); aspect-ratio: 1;
    display: grid; place-items: center; text-decoration: none; border-radius: 50%;
    background: var(--hot); color: #fff; box-shadow: 0 10px 30px rgba(214, 31, 105, 0.35);
    transform: rotate(8deg);
  }
  .sticker:hover { background: var(--pink); }
  .sticker svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sticker text { font-family: var(--ui); font-weight: 600; font-size: 11.5px; fill: #fff; letter-spacing: 0.04em; }
  .sticker .heart { font-size: 2.2rem; line-height: 1; position: relative; }

  /* Featured poem */
  .feature { background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--rule); border-radius: 2rem; padding: clamp(1.75rem, 5vw, 3.5rem); margin: 1.5rem 0 3rem; }
  .when { font-family: var(--ui); font-size: 0.92rem; color: var(--ink-soft); margin: 0 0 0.75rem; }
  .poem-title { font-weight: 700; font-style: italic; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 1.75rem; }
  .poem-title a { text-decoration: none; }
  .poem-title a:hover { color: var(--pink); }
  .poem { font-size: 1.3rem; line-height: 1.65; max-width: 34rem; font-weight: 400; }
  .poem p { margin: 0 0 1.7rem; white-space: pre-line; }
  .poem p:last-child { margin-bottom: 0; }

  /* Index */
  .index-head { font-style: italic; font-weight: 700; font-size: 2.2rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
  .tools { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; font-family: var(--ui); color: var(--ink-soft); font-size: 0.98rem; }
  .btn { background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 0.5rem 1.2rem; cursor: pointer; font-family: var(--ui); font-weight: 500; }
  .btn:hover { background: var(--pink); color: #fff; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { border-top: 1px solid var(--rule); }
  .list li:last-child { border-bottom: 1px solid var(--rule); }
  .list a { display: block; padding: 1.35rem 0; text-decoration: none; transition: padding-left 0.25s ease; }
  .list a:hover { padding-left: 0.9rem; }
  .list h3 { font-weight: 700; font-style: italic; font-size: clamp(1.8rem, 4.5vw, 2.6rem); line-height: 1.1; letter-spacing: -0.015em; margin: 0; }
  .list a:hover h3 { color: var(--pink); }
  .list .first { margin: 0.25rem 0 0; color: var(--ink-soft); }
  .list .stamp { font-family: var(--ui); font-size: 0.88rem; color: var(--ink-soft); margin-top: 0.15rem; }

  /* Home panels: titles only */
  .sections { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin: 1.5rem 0 1rem; align-items: start; }
  .panel { background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--rule); border-radius: 2rem; padding: clamp(1.5rem, 4vw, 2.5rem); }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 0.75rem; }
  .panel-head h2 { font-style: italic; font-weight: 700; font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0; }
  .panel-head h2 a { text-decoration: none; }
  .panel-head h2 a:hover { color: var(--pink); }
  .panel .list h3 { font-size: clamp(1.4rem, 3vw, 1.8rem); }
  .panel .list a { padding: 1rem 0; }
  .see-all { display: inline-block; margin-top: 1rem; font-family: var(--ui); font-weight: 500; color: var(--pink); text-underline-offset: 4px; }
  .empty { font-family: var(--ui); color: var(--ink-soft); margin: 0.5rem 0 0; }
  .hero .btn { margin-top: 1.5rem; }
  .section-page { padding: 2.5rem 0 3rem; }
  .section-page h1 { font-weight: 800; font-style: italic; font-size: clamp(3rem, 10vw, 6rem); line-height: 1; letter-spacing: -0.03em; margin: 0 0 0.75rem; }
  .section-page .blurb { font-family: var(--ui); color: var(--ink-soft); margin: 0 0 1.5rem; }
  @media (max-width: 800px) { .sections { grid-template-columns: 1fr; } }

  /* Single poem */
  .back { background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--ui); color: var(--ink-soft); text-decoration: underline; text-underline-offset: 4px; }
  .back:hover { color: var(--pink); }
  .single { padding: 2rem 0 4rem; }
  .single .feature { margin-top: 1.5rem; }
  .pager { display: flex; justify-content: space-between; gap: 1.5rem; margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); max-width: 34rem; }
  .pager a { text-decoration: none; max-width: 15rem; font-style: italic; font-weight: 600; }
  .pager a:hover { color: var(--pink); }
  .pager small { display: block; font-family: var(--ui); font-style: normal; font-weight: 400; color: var(--ink-soft); }
  .pager .next { text-align: right; margin-left: auto; }

  .about { padding: 3rem 0 5rem; }
  .about h1 { font-weight: 800; font-style: italic; font-size: clamp(3rem, 10vw, 6rem); line-height: 1; letter-spacing: -0.03em; margin: 0 0 1.5rem; }
  .about .poem p { white-space: normal; }

  footer.site { padding: 2rem 0 2.5rem; color: var(--ink-soft); font-family: var(--ui); font-size: 0.95rem; }

  @media (max-width: 640px) {
    .hero { padding-top: 7.5rem; }
    .sticker { top: 0.5rem; }
    .feature { border-radius: 1.5rem; }
    .poem { font-size: 1.2rem; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .hero h1 { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
    .sticker svg { animation: spin 22s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="#/" id="brand"></a>
    <nav aria-label="Main">
      <a href="#/poems" id="nav-poems">Poems</a>
      <a href="#/thoughts" id="nav-thoughts">Thoughts &amp; Stories</a>
      <a href="#/about" id="nav-about">About</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1"></main>

<footer class="site"><div class="wrap"><span id="footer-text"></span></div></footer>

<script>
/* ==========================================================
   EDIT THIS SECTION
   ========================================================== */
const SITE = {
  name: "Kriti Paudel",
  tagline: "Soft things, said slowly.",
  subline: "Poems and small stories about the quiet parts of a day, and the loud parts of a heart.",
  about: [
    "Write a few sentences about yourself here: when you write, what moves you, what readers might find here.",
    "You can add as many paragraphs as you like."
  ],
  email: "kriti13p@gmail.com"
};

/* To add something new: copy one block below, paste it at the TOP of the list,
   and change the fields.
   - slug:  a short unique id, no spaces (used in the page link)
   - type:  "poem" for the Poems section, or "thought" for Thoughts & Stories
   - title: the poem's title
   - date:  YYYY-MM-DD
   - body:  type the poem exactly as it should look. Line breaks are kept.
            Leave a blank line between stanzas. */
const POEMS = [
  {
    slug: "healing-isnt-loud",
    type: "poem",
    title: "Healing Isn't Loud",
    date: "2026-10-09",
    body: `A soft melody found its way to me,
like a forgotten song from another era.

An era where I could finally be myself.

Perhaps this is what healing feels like.

Not loud.
Not dramatic.
Just the quiet that arrives after the thunder has exhausted itself.

The sky no longer begs to be noticed.
It simply exists
bright enough,
gentle enough,
like the first morning of summer.

And then it rains.

Not the kind of rain that floods the earth,
but the kind that kisses your face
one drop at a time,
until you realize
you were never trying to escape the rain

you were only afraid of the storm.

Everyone says,
"You'll be okay."

But how beautiful it is
when someone doesn't rush to fix you,
doesn't interrupt your silence,
doesn't search for the perfect advice

they simply stay.

I've solved equations,
untangled derivatives,
found answers hidden inside pages of mathematics.

Yet telling someone,
"I'm not okay,"
has always been the hardest problem I've ever known.

Maybe healing isn't becoming someone new.

Maybe it's finally meeting
the version of yourself
that no longer has to pretend.`
  },
    {
    slug: "by-the-lakeside",
    type: "thought",
    title: "By the Lakeside",
    date: "2026-10-09",
    body: `We were sitting by the lakeside shore, the cold breeze continuously hitting our faces. Both of us had two bottles of beer in our hands, yet neither of us really knew what to say. We were trying to speak, but somehow words could never do justice to that moment.

The silence between us wasn’t awkward though. It was warm. Comfortable. The kind of silence where feelings speak louder than words ever could.

Suddenly, the girl felt a hand slowly wrap around her back.

She froze for a second.

But deep down, she already knew that the only thing she needed at that moment was warmth. A tight hug. A safe place to rest her heart for a little while.

She wanted to ask for it so badly, but fear always stopped her before the words could escape.

And somehow… he understood her unspoken feelings.

Without saying anything, he gently pulled her closer towards him, and she melted into his arms like that was where she was always meant to be.

At that moment, she stopped pretending to be strong. She let herself breathe. She let herself feel. She let all the hidden emotions quietly leave her chest.

And suddenly, with the cold breeze, the soft silence, and his arms around her…

everything felt right.`
 },
    {
    slug: "across-the-street",
    type: "thought",
    title: "Across the Street",
    date: "2026-10-08",
    body: `It was one of those evenings when the sky couldn't decide whether it wanted to rain or stay quiet.

She was walking slowly, holding an umbrella she wasn't really using, because the rain was barely there just tiny drops touching her face like the sky was trying not to disturb her.

Then she saw him.

Standing across the street.

Tall, with messy hair that the soft wind kept moving around his face, his hands casually tucked into his pockets. There was something effortless about him, like he wasn't trying to be noticed at all.

And then she saw his eyes.

She froze.

For a moment, she completely forgot where she was going.

It wasn't love. At least, she didn't know it was.

It was just... strange.

The kind of strange where someone you've never seen before suddenly feels impossible to look away from.

She stood there, quietly watching him from across the street, while the rain continued falling between them.`
  },
    {
    slug: "somewhere-between-wanting-and-leaving",
    type: "poem",
    title: "Somewhere Between Wanting and Leaving",
    date: "2026-10-09",
    body: `Life
Wasn’t it supposed
To feel like a fairytale?

Not perfect,
But soft enough
To breathe in.

Then why the rush?
Running toward things
That won’t even matter
After some time.

Why this obsession
With beauty
Not the kind within,
But the kind we create
Just to feel secure?

Sometimes I wonder
Do I even belong
In this race?

Isn’t life supposed to be
Joyful little moments,
Awkward laughter,
Vulnerable hearts,
An emotional rollercoaster
We ride without fear?

Yet the urge grows
To leave it all.

The noise,
The pressure,
The endless rat race.

To settle somewhere
High in the mountains,
Where beauty belongs
To the sky and trees,
Not to mirrors.

Where bonds feel real,
And silence
Doesn’t feel empty.

Where I can finally
Be myself.

But even then
I question

Would I go there
For peace?

Or just
To feel secure?`
  },
  {
    slug: "youll-be-okay",
    type: "poem",
    title: "You'll Be Okay",
    date: "2026-10-07",
    body: `Everyone says,
"You'll be okay."

But how beautiful it is
when someone doesn't rush to fix you,
doesn't interrupt your silence,
doesn't search for the perfect advice`
  }
];
/* ========================================================== */

const app = document.getElementById("app");
const SECTIONS = {
  poem:    { label: "Poems",              hash: "#/poems",    blurb: "Lines that wanted to be poems." },
  thought: { label: "Thoughts & Stories", hash: "#/thoughts", blurb: "Little stories and random thoughts that showed up on their own." }
};
const all = POEMS
  .map((p) => ({ ...p, type: p.type === "poem" ? "poem" : "thought" }))
  .sort((a, b) => (a.date < b.date ? 1 : -1));
const ofType = (t) => all.filter((p) => p.type === t);
const HOME_LIMIT = 6;
const fmtDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach((c) => c != null && n.append(c));
  return n;
}

function setNav(page) {
  [["poem", "poems"], ["thought", "thoughts"], ["about", "about"]].forEach(([key, id]) => {
    const a = document.getElementById("nav-" + id);
    if (key === page) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

const stanzas = (p) => p.body.split(/\n\s*\n/).map((s) => el("p", { text: s.trim() }));

/* Static markup only (no user text), so innerHTML is safe here */
const STICKER_SVG = `
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <defs><path id="ring" d="M60,60 m-43,0 a43,43 0 1,1 86,0 a43,43 0 1,1 -86,0"/></defs>
    <text><textPath href="#ring" textLength="262" lengthAdjust="spacing">newest piece ✦ newest piece ✦ </textPath></text>
  </svg>
  <span class="heart" aria-hidden="true">♡</span>`;

function titleList(items) {
  return el("ul", { class: "list" },
    items.map((p) =>
      el("li", {},
        el("a", { href: `#/piece/${p.slug}` },
          el("h3", { text: p.title }),
          el("div", { class: "stamp", text: fmtDate(p.date) })
        )
      )
    )
  );
}

function panel(type) {
  const sec = SECTIONS[type];
  const items = ofType(type);
  return el("section", { class: "panel", "aria-label": sec.label },
    el("div", { class: "panel-head" },
      el("h2", {}, el("a", { href: sec.hash, text: sec.label }))
    ),
    items.length ? titleList(items.slice(0, HOME_LIMIT)) : el("p", { class: "empty", text: "Nothing here yet." }),
    items.length > HOME_LIMIT ? el("a", { class: "see-all", href: sec.hash, text: `See all ${items.length}` }) : null
  );
}

function renderHome() {
  setNav("");
  document.title = `${SITE.name} — Writing`;
  const latest = all[0];

  const hero = el("section", { class: "hero" });
  if (latest) {
    const sticker = el("a", { class: "sticker", href: `#/piece/${latest.slug}`, "aria-label": `Read the newest piece: ${latest.title}` });
    sticker.innerHTML = STICKER_SVG;
    hero.append(sticker);
  }
  hero.append(
    el("h1", { text: SITE.tagline }),
    el("p", { class: "sub", text: SITE.subline })
  );
  if (all.length) {
    hero.append(el("button", { class: "btn", type: "button", text: "Surprise me", onclick: () => {
      location.hash = `#/piece/${all[Math.floor(Math.random() * all.length)].slug}`;
    } }));
  }

  app.replaceChildren(
    hero,
    el("div", { class: "sections" }, panel("poem"), panel("thought")),
    el("div", { style: "height:3rem" })
  );
}

function renderSection(type) {
  const sec = SECTIONS[type];
  setNav(type);
  document.title = `${sec.label} — ${SITE.name}`;
  const items = ofType(type);
  app.replaceChildren(
    el("section", { class: "section-page" },
      el("h1", { text: sec.label }),
      el("p", { class: "blurb", text: sec.blurb }),
      el("div", { class: "panel" }, items.length ? titleList(items) : el("p", { class: "empty", text: "Nothing here yet." }))
    ),
    el("div", { style: "height:3rem" })
  );
}

function renderPiece(slug) {
  const p = all.find((x) => x.slug === slug);
  if (!p) return renderHome();
  const sec = SECTIONS[p.type];
  const same = ofType(p.type);
  const i = same.findIndex((x) => x.slug === slug);
  const newer = same[i - 1], older = same[i + 1];
  setNav(p.type);
  document.title = `${p.title} — ${SITE.name}`;

  app.replaceChildren(
    el("section", { class: "single" },
      el("button", { class: "back", type: "button", text: `Back to ${sec.label}`, onclick: () => { location.hash = sec.hash; } }),
      el("article", { class: "feature" },
        el("p", { class: "when", text: `${sec.label}, ${fmtDate(p.date)}` }),
        el("h1", { class: "poem-title", text: p.title }),
        el("div", { class: "poem" }, stanzas(p)),
        el("div", { class: "pager" },
          older ? el("a", { href: `#/piece/${older.slug}` }, el("small", { text: "Previous" }), older.title) : el("span"),
          newer ? el("a", { class: "next", href: `#/piece/${newer.slug}` }, el("small", { text: "Next" }), newer.title) : null
        )
      )
    )
  );
}

function renderAbout() {
  setNav("about");
  document.title = `About — ${SITE.name}`;
  app.replaceChildren(
    el("section", { class: "about" },
      el("h1", { text: "About" }),
      el("div", { class: "feature" },
        el("div", { class: "poem" },
          SITE.about.map((t) => el("p", { text: t })),
          el("p", {}, "Write to me at ", el("a", { href: `mailto:${SITE.email}`, text: SITE.email }), ".")
        )
      )
    )
  );
}

function route() {
  const h = location.hash || "#/";
  const m = h.match(/^#\/piece\/(.+)$/);
  if (m) renderPiece(decodeURIComponent(m[1]));
  else if (h === "#/poems") renderSection("poem");
  else if (h === "#/thoughts") renderSection("thought");
  else if (h === "#/about") renderAbout();
  else renderHome();
  window.scrollTo(0, 0);
}

document.getElementById("brand").textContent = SITE.name;
document.getElementById("footer-text").textContent = `© ${new Date().getFullYear()} ${SITE.name}. All writing is my own.`;
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
